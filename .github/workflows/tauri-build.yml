name: Tauri Build (Windows)

on:
  push:
    branches: [ main ]
    tags:
      - 'v*'
  pull_request:
    branches: [ main ]

permissions:
  contents: write

jobs:
  build-tauri:
    runs-on: windows-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: |
          cd frontend
          npm ci
          npm list

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        
      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: frontend/src-tauri -> Cargo.lock

      - name: Debug info
        run: |
          node --version
          npm --version
          rustc --version
          cargo --version
          cd frontend
          cat package.json

      - name: Build frontend
        run: |
          cd frontend
          npm run build

      - name: Build Tauri app
        run: |
          cd frontend
          npx tauri build --verbose

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ai-worker-windows-${{ github.sha }}
          path: |
            frontend/src-tauri/target/release/bundle/**/*
          if-no-files-found: warn
          retention-days: 7